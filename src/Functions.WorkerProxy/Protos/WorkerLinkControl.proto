syntax = "proto3";

option csharp_namespace = "Azure.Functions.WorkerProxy.Control";

package azure.functions.workerproxy;

service WorkerLinkControl {
  rpc AcknowledgeLink (AcknowledgeLinkRequest) returns (AcknowledgeLinkResponse);
}

message AcknowledgeLinkRequest {
  SplitPodIdentity runtime = 1;
}

message AcknowledgeLinkResponse {
}

message SplitPodIdentity {
  string resource_namespace = 1;
  string pod_name = 2;
  string pod_guid = 3;
  string legion_stamp_name = 4;
  string pod_type = 5;
  SplitFunctionAppIdentity app = 6;
}

message SplitFunctionAppIdentity {
  string function_app_name = 1;
  optional int32 function_app_site_id = 2;
  string antares_stamp_name = 3;
}
