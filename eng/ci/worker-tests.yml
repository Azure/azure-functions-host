parameters:
- name: WorkerName
  displayName: Worker Name
  type: string
  default: "default"

- name: WorkerVersion
  displayName: Worker Version
  type: string
  default: "default"

# This is an intermediate repository. We cannot use 'self', as that points to the triggering repo.
# We also cannot use relative paths, as that will point to the 1es repo we extend.
# Instead, we need to re-use the alias defines us with. We will default to 'eng' for now.
# This is a hack to workaround a gap in AzDevOps' template system.
- name: repositoryAlias
  type: string
  default: host

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    parameters:
      settings:
        networkIsolationPolicy: Permissive
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release

variables:
- template: /eng/ci/templates/variables/build.yml@${{ parameters.repositoryAlias }}
- template: /ci/variables/cfs.yml@eng
- name: buildNumber
  value: $[ counter('build', 0) ]

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    settings:
        networkIsolationPolicy: Permissive
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows


    sdl:
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/eng/sdl/.gdnsuppress

    stages:
    - stage: Test
      jobs:
      - template: /eng/ci/templates/official/jobs/run-integration-tests.yml@${{ parameters.repositoryAlias }}
        parameters:
          WorkerName: ${{ parameters.WorkerName }}
          WorkerVersion: ${{ parameters.WorkerVersion }}