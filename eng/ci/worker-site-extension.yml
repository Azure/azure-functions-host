parameters:
- name: WorkerPackageName
  displayName: Worker Package Name
  type: string
  default: Microsoft.Azure.Functions.DotNetIsolatedNativeHost

- name: WorkerPackageVersion
  displayName: Worker Package Version
  type: string
  default: 1.0.13

trigger: none # ensure this is not ran as a CI build

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release
  - repository: host
    type: git
    name: azure.azure-functions-host-tests
    ref: surgupta/testfiles2
    alias: host

variables:
- template: /eng/ci/templates/variables/build.yml@self
- template: /ci/variables/cfs.yml@eng
- name: buildNumber
  value: $[ counter('build', 0) ]

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    sdl:
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/eng/sdl/.gdnsuppress
      sourceRepositoriesToScan:
        include:
          - repository: host

    stages:
    - template: /eng/ci/integration-tests.yml@host
    
    - stage: BuildSiteExtension
      jobs:
      - template: /eng/ci/templates/official/jobs/build-worker-site-ext.yml@self
        parameters:
          WorkerPackageName: ${{ parameters.WorkerPackageName }}
          WorkerPackageVersion: ${{ parameters.WorkerPackageVersion }}
