# Triggers the cold start and measures latency.
#
# Windows (IIS): Single POST with ?forcespecialization — SpecializationSimulatorMiddleware
#   reads AzureWebJobsScriptRoot from the JSON body, triggers specialization, and forwards
#   the request to the function endpoint.
#
# Linux: Two-call approach matching production —
#   1. POST encrypted HostAssignmentContext to /admin/instance/assign (triggers specialization)
#   2. GET the function endpoint (measures cold-start latency)
#
# The encryption format matches EncryptionHelper.Encrypt():
#   {base64(IV)}.{base64(AES-CBC-ciphertext)}.{base64(SHA256(key))}

parameters:
- name: os
  type: string
  values: [Windows, Linux]

steps:
- pwsh: |
    function ConvertTo-KeyBytes([string]$key) {
        # Matches SecretsUtility.ToKeyBytes(): 64-char hex => 32 bytes; otherwise base64.
        if ($key.Length -eq 64 -and $key -match '^[0-9a-fA-F]+$') {
            $bytes = [byte[]]::new(32)
            for ($i = 0; $i -lt 64; $i += 2) {
                $bytes[$i / 2] = [Convert]::ToByte($key.Substring($i, 2), 16)
            }
            Write-Host "Encryption key parsed as hex (32 bytes)"
            return $bytes
        }

        $bytes = [Convert]::FromBase64String($key)
        Write-Host "Encryption key parsed as base64 ($($bytes.Length) bytes)"
        return $bytes
    }

    function New-EncryptedContext([string]$plainText, [byte[]]$keyBytes) {
        # Produces the EncryptionHelper.Encrypt() format:
        #   {base64(IV)}.{base64(AES-CBC-ciphertext)}.{base64(SHA256(key))}
        $aes = [System.Security.Cryptography.Aes]::Create()
        try {
            $aes.Key = $keyBytes
            $aes.GenerateIV()

            $plainBytes = [System.Text.Encoding]::UTF8.GetBytes($plainText)
            $ms = [System.IO.MemoryStream]::new()
            $encryptor = $aes.CreateEncryptor($aes.Key, $aes.IV)
            $cs = [System.Security.Cryptography.CryptoStream]::new($ms, $encryptor, [System.Security.Cryptography.CryptoStreamMode]::Write)
            try {
                $cs.Write($plainBytes, 0, $plainBytes.Length)
                $cs.FlushFinalBlock()
                $cipherBytes = $ms.ToArray()
            } finally {
                $cs.Dispose()
                $ms.Dispose()
            }

            $keyHash = [System.Security.Cryptography.SHA256]::HashData($keyBytes)
            return "{0}.{1}.{2}" -f [Convert]::ToBase64String($aes.IV), [Convert]::ToBase64String($cipherBytes), [Convert]::ToBase64String($keyHash)
        } finally {
            $aes.Dispose()
        }
    }

    $isWindowsOS = "${{ parameters.os }}" -eq "Windows"
    $helloUrl = "$(functionInvocationUrl)"
    $functionAppOutputPath = "$(functionAppOutputPath)"
    $siteName = "$(WEBSITE_SITE_NAME)"

    # Append function key to URL if available (jittrace runs retrieve this from admin API).
    $functionKey = $env:FUNCTION_KEY
    if ($functionKey) {
        $separator = if ($helloUrl.Contains("?")) { "&" } else { "?" }
        $helloUrl = "${helloUrl}${separator}code=${functionKey}"
    }

    if (-not $isWindowsOS) {
        # Linux: mimic production specialization via encrypted /admin/instance/assign.
        $encryptionKey = $env:ENCRYPTION_KEY
        if (-not $encryptionKey) {
            Write-Host "##vso[task.logissue type=error]ENCRYPTION_KEY not set. Cannot encrypt instance/assign payload."
            exit 1
        }

        $keyBytes = ConvertTo-KeyBytes $encryptionKey

        # Build HostAssignmentContext (matches Models/HostAssignmentContext.cs)
        $assignmentContext = @{
            siteId           = 1
            siteName         = $siteName
            environment      = @{ AzureWebJobsScriptRoot = $functionAppOutputPath }
            lastModifiedTime = (Get-Date).ToString("o")
        } | ConvertTo-Json -Depth 10 -Compress

        $encryptedContext = New-EncryptedContext -plainText $assignmentContext -keyBytes $keyBytes

        $assignUrl = "http://localhost:5000/admin/instance/assign?code=test"
        $assignPayload = @{ encryptedContext = $encryptedContext } | ConvertTo-Json -Compress

        Write-Host "Triggering specialization via $assignUrl"
        $specializationDuration = Measure-Command {
            $response = Invoke-WebRequest -Uri $assignUrl -Method Post -Body $assignPayload -ContentType "application/json" -ErrorAction Stop
        }
        Write-Host "Specialization response: $($response.StatusCode). Latency: $($specializationDuration.TotalMilliseconds) ms"

        # Measure cold-start latency (specialization already triggered above)
        Write-Host "Calling $helloUrl"
        $duration = Measure-Command {
            $response = Invoke-WebRequest -Uri $helloUrl -Method Get -ErrorAction Stop
        }
    } else {
        # Windows: POST with AzureWebJobsScriptRoot in body + ?forcespecialization in URL
        $body = @{ AzureWebJobsScriptRoot = $functionAppOutputPath } | ConvertTo-Json

        Write-Host "Calling $helloUrl (POST with specialization payload)"
        Write-Host "Request body: $body"
        $duration = Measure-Command {
            $response = Invoke-WebRequest -Uri $helloUrl -Method Post -Body $body -ContentType "application/json" -ErrorAction Stop
        }
    }

    Write-Host "Response: $($response.StatusCode)"
    Write-Host "Cold start latency: $($duration.TotalMilliseconds) ms"
    Write-Host "##vso[task.setvariable variable=coldStartLatency;isOutput=true]$($duration.TotalMilliseconds)"
  displayName: Record cold start latency
  name: Record
  env:
    ENCRYPTION_KEY: $(PGO-APP-INSTANCE-ASSIGN-PAYLOAD-ENCRYPTION-KEY)
    FUNCTION_KEY: $(functionKey)
