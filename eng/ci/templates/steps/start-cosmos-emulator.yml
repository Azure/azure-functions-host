steps:
- task: PowerShell@2
  displayName: Start Windows Cosmos DB emulator
  timeoutInMinutes: 5
  inputs:
    targetType: inline
    script: |
      Import-Module "$env:ProgramFiles\Azure Cosmos DB Emulator\PSModules\Microsoft.Azure.CosmosDB.Emulator"
      Get-ChildItem "$env:ProgramFiles\Azure Cosmos DB Emulator" -Filter "*Emulator.exe" |
        ForEach-Object { $_.VersionInfo } |
        Select-Object FileName, FileVersion, ProductVersion | Format-List

      # Start early so emulator startup overlaps the build; wait-cosmos-emulator.yml blocks until it is ready.
      Start-CosmosDbEmulator -NoFirewall -NoUI -NoWait
