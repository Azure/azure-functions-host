steps:
# NativeDependency_NoRuntimes queries ItemDb/ItemCollection but does not create it.
- task: PowerShell@2
  displayName: Create Cosmos DB emulator resources for native dependency test
  condition: and(succeededOrFailed(), eq(variables['CosmosEmulatorPrepared'], 'true'))
  timeoutInMinutes: 5
  inputs:
    targetType: inline
    script: |
      $ErrorActionPreference = 'Stop'
      $endpoint = 'https://localhost:8081'
      $key = [Convert]::FromBase64String('C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==')

      function New-CosmosResource([string] $resourceType, [string] $parentLink, [hashtable] $body)
      {
          $date = [DateTime]::UtcNow.ToString('r')
          $payload = "post`n$resourceType`n$parentLink`n$($date.ToLowerInvariant())`n`n"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256 (, $key)
          $signature = [Convert]::ToBase64String($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)))
          $headers = @{
              'authorization' = [Uri]::EscapeDataString("type=master&ver=1.0&sig=$signature")
              'x-ms-date' = $date
              'x-ms-version' = '2018-12-31'
          }

          $uri = if ($parentLink) { "$endpoint/$parentLink/$resourceType" } else { "$endpoint/$resourceType" }
          try
          {
              Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 5) | Out-Null
              Write-Host "Created $uri '$($body.id)'."
          }
          catch
          {
              if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 409)
              {
                  Write-Host "$uri '$($body.id)' already exists."
                  return
              }

              throw
          }
      }

      # The emulator can report Running shortly before it accepts requests.
      $deadline = (Get-Date).AddMinutes(2)
      while ($true)
      {
          try
          {
              New-CosmosResource 'dbs' '' @{ id = 'ItemDb' }
              New-CosmosResource 'colls' 'dbs/ItemDb' @{ id = 'ItemCollection'; partitionKey = @{ paths = @('/id'); kind = 'Hash' } }
              break
          }
          catch
          {
              if ((Get-Date) -gt $deadline)
              {
                  throw
              }

              Write-Host "Cosmos DB emulator request failed: $($_.Exception.Message). Retrying..."
              Start-Sleep -Seconds 5
          }
      }
