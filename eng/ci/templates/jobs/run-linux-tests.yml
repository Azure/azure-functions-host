parameters:
- name: linuxPoolName
  displayName: Pool used for Linux tests
  type: string
  default: 1es-pool-azfunc-public
- name: linuxPoolImage
  displayName: Image used for Linux tests
  type: string
  default: 1es-ubuntu-24.04-min

jobs:
- job: RunLinuxTests
  displayName: Build and Test Azure Functions Host (Linux)

  pool:
    name: ${{ parameters.linuxPoolName }}
    image: ${{ parameters.linuxPoolImage }}
    os: linux

  variables:
    localImage: functions-worker-proxy-ci:latest

  steps:
  - template: /eng/ci/templates/install-dotnet.yml@self

  - task: DotNetCoreCLI@2
    displayName: Azure Functions Host Tests (Linux)
    inputs:
      command: test
      arguments: -v m -c release
      # Build the product test graphs without bootstrapping the manual Aspire tool.
      projects: test/Functions.*.Tests/*.csproj

  - script: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev openssl
    displayName: Install Native AOT prerequisites

  - task: DotNetCoreCLI@2
    displayName: Native AOT publish (linux-x64)
    inputs:
      command: publish
      publishWebProjects: false
      zipAfterPublish: false
      modifyOutputPath: false
      arguments: -c release -r linux-x64 --self-contained true
      projects: src/Functions.WorkerProxy/Functions.WorkerProxy.csproj

  - task: 1ES.BuildContainerImage@1
    displayName: Build WorkerProxy container
    inputs:
      dockerfile: $(Build.SourcesDirectory)/src/Functions.WorkerProxy/Dockerfile
      context: $(Build.SourcesDirectory)/out/pub/Functions.WorkerProxy/release_linux-x64
      localImage: $(localImage)

  - script: |
      set -euo pipefail
      certificateDirectory="$(mktemp -d)"
      containerId=""
      cleanup() {
        exitCode=$?
        trap - EXIT
        if [ -n "$containerId" ]; then
          if [ "$exitCode" -ne 0 ]; then
            docker logs "$containerId" || true
          fi
          docker rm --force "$containerId" >/dev/null 2>&1 || true
        fi

        rm -f -- "$certificateDirectory/server.crt" "$certificateDirectory/server.key"
        rmdir -- "$certificateDirectory"
        exit "$exitCode"
      }
      trap cleanup EXIT

      umask 077
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
        -subj /CN=ci-worker-proxy -days 1 \
        -out "$certificateDirectory/server.crt" -keyout "$certificateDirectory/server.key"
      chmod 644 "$certificateDirectory/server.crt"
      echo "Starting WorkerProxy image: $(localImage)"
      containerId="$(docker run --detach \
        --publish 127.0.0.1::80 \
        --mount "type=bind,source=$certificateDirectory,target=/etc/ssl/workerproxy,readonly" \
        --env WEBSITE_POD_NAME=ci-worker-pod \
        $(localImage))"
      echo "Started WorkerProxy container: $containerId"

      managementPort="$(docker port "$containerId" 80/tcp | head -n 1 | sed 's/.*://')"
      test -n "$managementPort"
      echo "WorkerProxy management port: $managementPort"
      echo "Probing http://127.0.0.1:$managementPort/admin/instance/ready"
      httpStatus="$(curl --fail --silent --show-error \
        --output /dev/null --write-out '%{http_code}' \
        --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
        "http://127.0.0.1:$managementPort/admin/instance/ready")"
      echo "WorkerProxy readiness probe succeeded with HTTP $httpStatus."
      echo "WorkerProxy container logs:"
      docker logs "$containerId"
    displayName: Smoke WorkerProxy container
