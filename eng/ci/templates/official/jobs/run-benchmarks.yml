  # # Compare results with baseline
  # - pwsh: |
  #     crank compare "$(baselineBenchmarkResultFilePath)" "$(benchmarkResultsJsonPath)"
  #   condition: and(succeeded(), ne(variables['baselineBenchmarkResultFilePath'], ''))
