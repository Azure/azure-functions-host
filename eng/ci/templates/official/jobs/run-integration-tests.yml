parameters:
- name: WorkerName
  displayName: Worker Name
  type: string

- name: WorkerVersion
  displayName: Worker Version
  type: string

# This is an intermediate repository. We cannot use 'self', as that points to the triggering repo.
# We also cannot use relative paths, as that will point to the 1es repo we extend.
# Instead, we need to re-use the alias defines us with. We will default to 'eng' for now.
# This is a hack to workaround a gap in AzDevOps' template system.
- name: repositoryAlias
  type: string
  default: host

jobs:
- job: RunIntegrationTests
  displayName: Run Integration Tests

  pool:
    name: 1es-pool-azfunc
    image: 1es-windows-2022
    os: windows

  variables:
    test_projects: test/WebJobs.Script.Tests.Integration/WebJobs.Script.Tests.Integration.csproj
    test_projects_full: $(Build.SourcesDirectory)/$(test_projects)
    is_release: $[contains(variables['Build.SourceBranch'], 'release/')]
    test_args: -c release --no-build

  steps:
  - checkout: azure.azure-functions-host
    persistCredentials: true
    clean: true
    fetchDepth: 0
    ref: refs/heads/surgupta/worker-tests-yml
  - task: PowerShell@2
    displayName: Print checkout path
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Write-Host "Checked out repo path: $(Build.SourcesDirectory)"
  - task: PowerShell@2
    displayName: List Build.SourcesDirectory recursively
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $src = '$(Build.SourcesDirectory)'
        Write-Host ("Listing files under Build.SourcesDirectory: {0}" -f $src)
        if (Test-Path $src) {
          Get-ChildItem -Path $src -Recurse | Select-Object FullName | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host ("Path not found: {0}" -f $src)
        }
  - template: /eng/ci/templates/install-dotnet.yml@${{ parameters.repositoryAlias }}

  - task: UseNode@1
    inputs:
      version: 22.x

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.7'
      addToPath: true

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      npm install -g azurite
    displayName: Install Azurite

  - task: AzureCLI@2
    displayName: Azure login
    inputs:
      azureSubscription: Azure-Functions-Host-CI-internal
      scriptType: ps
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        az account show | Out-String | Write-Host
        Write-Host "Azure CLI login established for subsequent scripts."

  - task: PowerShell@2
    displayName: Install Az.Storage Powershell module
    inputs:
      targetType: inline
      script: 'Install-Module -Name Az.Storage -RequiredVersion 1.11.0 -Scope CurrentUser -Force -AllowClobber'

  - task: PowerShell@2
    displayName: Set environment variables
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.setvariable variable=ConnectionStrings__CosmosDB]$env:CosmosDbSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubSender]$env:AzureWebJobsEventHubSenderSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubReceiver]$env:AzureWebJobsEventHubReceiverSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubPath]testhub"
    env:
      AzureWebJobsStorageSecretMap: $(Storage)
      AzureWebJobsSecondaryStorageSecretMap: $(SecondaryStorage)
      CosmosDbSecretMap: $(CosmosDb)
      AzureWebJobsEventHubSenderSecretMap: $(EventHub)
      AzureWebJobsEventHubReceiverSecretMap: $(EventHub)

  - task: PowerShell@2
    displayName: Diagnose project paths
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Write-Host "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        Write-Host "System.DefaultWorkingDirectory=$(System.DefaultWorkingDirectory)"
        $projRel = '$(test_projects)'
        $projAbs = '$(test_projects_full)'
        Write-Host "test_projects=$projRel"
        Write-Host "test_projects_full=$projAbs"
        Write-Host ("Exists (rel): {0}" -f (Test-Path $projRel))
        Write-Host ("Exists (abs): {0}" -f (Test-Path $projAbs))
        Write-Host "Listing csproj in integration tests directory:"
        Get-ChildItem -Path "$(Build.SourcesDirectory)/test/WebJobs.Script.Tests.Integration" -Recurse -Filter *.csproj | ForEach-Object { Write-Host $_.FullName }

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: custom
      custom: restore
      arguments: -v m -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      arguments: -v m -c release --no-restore -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: C# end to end tests
    inputs:
      command: test
      testRunTitle: C# end to end tests
      arguments: '--filter "Group=CSharpEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Node end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Node end to end tests
      arguments: '--filter "Group=NodeEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Direct load end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Direct load end to end tests
      arguments: '--filter "Group=DirectLoadEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: F# end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: F# end to end tests
      arguments: '--filter "Group=FSharpEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Language worker end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Language worker end to end tests
      arguments: '--filter "Group=LanguageWorkerSelectionEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Node script host end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Node script host end to end tests
      arguments: '--filter "Group=NodeScriptHostTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Raw assembly end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Raw assembly end to end tests
      arguments: '--filter "Group=RawAssemblyEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Samples end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Samples end to end tests
      arguments: '--filter "Group=SamplesEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Drain mode end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Drain mode end to end tests
      arguments: '--filter "Group=DrainModeEndToEndTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Standby mode end to end tests Windows
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Standby mode end to end tests Windows
      arguments: '--filter "Group=StandbyModeEndToEndTests_Windows" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  # Disabled to unblock in 202401. Will fix shortly.
  # - task: DotNetCoreCLI@2
  #   displayName: Standby mode end to end tests Linux
  #   condition: succeededOrFailed()
  #   inputs:
  #     command: test
  #     testRunTitle: Standby mode end to end tests Linux
  #     arguments: '--filter "Group=StandbyModeEndToEndTests_Linux" $(test_args)'
  #     projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Linux container end to end tests Windows
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Linux container end to end tests Windows
      arguments: '--filter "Group=ContainerInstanceTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: DotNetCoreCLI@2
    displayName: Release verification tests
    condition: ${{ eq(variables.is_release, true) }}
    inputs:
      command: test
      testRunTitle: Release verification tests
      arguments: '--filter "Group=ReleaseTests" $(test_args) -p:WorkerVersion=${{ parameters.WorkerVersion }} -p:WorkerName=${{ parameters.WorkerName }}'
      projects: $(test_projects_full)

  - task: AzurePowerShell@5
    condition: always()
    displayName: Checkin secrets
    inputs:
      azureSubscription: Azure-Functions-Host-CI-internal
      azurePowerShellVersion: 'LatestVersion'
      pwsh: true
      ScriptPath: eng/script/checkin-secrets.ps1
      ScriptArguments: '-leaseBlob $(LeaseBlob) -leaseToken $(LeaseToken)'
