jobs:
- job: RunIntegrationTests
  displayName: Run Integration Tests

  pool:
    name: 1es-pool-azfunc
    image: 1es-windows-2022
    os: windows

  variables:
    test_projects: test/WebJobs.Script.Tests.Integration/WebJobs.Script.Tests.Integration.csproj
    is_release: $[contains(variables['Build.SourceBranch'], 'release/')]
    test_args: -c release --no-build

  steps:
  - template: /eng/ci/templates/install-dotnet.yml@self

  - task: UseNode@1
    inputs:
      version: 22.x

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.13'
      addToPath: true

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: PowerShell@2
    displayName: Collect CI machine security diagnostics
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Continue'

        function Start-DiagnosticGroup($name) {
          Write-Host "##[group]$name"
        }

        function End-DiagnosticGroup {
          Write-Host "##[endgroup]"
        }

        Start-DiagnosticGroup "Agent and OS"
        [PSCustomObject]@{
          AgentName = $env:AGENT_NAME
          AgentMachineName = $env:AGENT_MACHINENAME
          AgentOS = $env:AGENT_OS
          AgentOSArchitecture = $env:AGENT_OSARCHITECTURE
          ComputerName = $env:COMPUTERNAME
          ImageOS = $env:ImageOS
          ImageVersion = $env:ImageVersion
        } | Format-List

        Get-CimInstance Win32_OperatingSystem |
          Select-Object Caption, Version, BuildNumber, OSArchitecture |
          Format-List
        End-DiagnosticGroup

        Start-DiagnosticGroup "Defender services and processes"
        Get-Service -Name WinDefend, Sense, WdNisSvc -ErrorAction SilentlyContinue |
          Select-Object Name, DisplayName, Status, StartType |
          Format-Table -AutoSize

        Get-Process -Name MsMpEng, MsSense, MpDefenderCoreService, SecurityHealthService -ErrorAction SilentlyContinue |
          Select-Object ProcessName, Id, Path |
          Format-Table -AutoSize
        End-DiagnosticGroup

        Start-DiagnosticGroup "Defender computer status"
        if (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) {
          Get-MpComputerStatus |
            Select-Object AMServiceEnabled, AMRunningMode, AntispywareEnabled, AntivirusEnabled,
              BehaviorMonitorEnabled, IoavProtectionEnabled, OnAccessProtectionEnabled,
              RealTimeProtectionEnabled, AntivirusSignatureVersion, AntispywareSignatureVersion,
              NISEnabled, NISSignatureVersion |
            Format-List
        }
        else {
          Write-Host "Get-MpComputerStatus is not available on this machine."
        }
        End-DiagnosticGroup

        Start-DiagnosticGroup "Defender preferences summary"
        if (Get-Command Get-MpPreference -ErrorAction SilentlyContinue) {
          $preference = Get-MpPreference
          $matchingExclusionPaths = @($preference.ExclusionPath | Where-Object { $_ -match 'Temp|FunctionsE2E|node_modules|agent|work' })
          $exclusionPaths = @($preference.ExclusionPath | Where-Object { ![string]::IsNullOrWhiteSpace($_) })
          $exclusionProcesses = @($preference.ExclusionProcess | Where-Object { ![string]::IsNullOrWhiteSpace($_) })
          $exclusionExtensions = @($preference.ExclusionExtension | Where-Object { ![string]::IsNullOrWhiteSpace($_) })
          [PSCustomObject]@{
            DisableRealtimeMonitoring = $preference.DisableRealtimeMonitoring
            DisableBehaviorMonitoring = $preference.DisableBehaviorMonitoring
            DisableIOAVProtection = $preference.DisableIOAVProtection
            DisableScriptScanning = $preference.DisableScriptScanning
            ExclusionPathCount = $exclusionPaths.Count
            ExclusionProcessCount = $exclusionProcesses.Count
            ExclusionExtensionCount = $exclusionExtensions.Count
            MatchingExclusionPaths = $matchingExclusionPaths -join '; '
          } | Format-List
        }
        else {
          Write-Host "Get-MpPreference is not available on this machine."
        }
        End-DiagnosticGroup

        Start-DiagnosticGroup "Endpoint DLP registry state"
        $windowsDefenderKey = 'HKLM:\SOFTWARE\Microsoft\Windows Defender'
        $featuresKey = Join-Path $windowsDefenderKey 'Features'

        Get-ItemProperty -Path $windowsDefenderKey -Name InstallLocation -ErrorAction SilentlyContinue |
          Select-Object InstallLocation |
          Format-List

        Get-ItemProperty -Path $featuresKey -Name SenseDlpEnabled -ErrorAction SilentlyContinue |
          Select-Object SenseDlpEnabled |
          Format-List
        End-DiagnosticGroup

  - script: |
      npm install -g azurite
    displayName: Install Azurite

  - task: PowerShell@2
    displayName: Install Az.Storage Powershell module
    inputs:
      targetType: inline
      script: 'Install-Module -Name Az.Storage -RequiredVersion 1.11.0 -Scope CurrentUser -Force -AllowClobber'

  - task: Npm@1
    displayName: npm ci
    inputs:
      command: ci
      workingDir: sample/CustomHandlerRetry

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: custom
      custom: restore
      arguments: -v m
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      arguments: -v m -c release --no-restore
      projects: $(test_projects)

  - task: AzurePowerShell@5
    displayName: Checkout secrets
    inputs:
      azureSubscription: Azure-Functions-Host-CI-internal
      azurePowerShellVersion: 'LatestVersion'
      pwsh: true
      ScriptPath: eng/script/checkout-secrets.ps1

  - task: AzureKeyVault@2
    inputs:
      # Note: This is actually a Service Connection in DevOps, not an Azure subscription name
      azureSubscription: Azure-Functions-Host-CI-internal
      keyVaultName: azure-functions-host-$(LeaseBlob)
      secretsFilter: '*'

  - task: PowerShell@2
    displayName: Set environment variables
    inputs:
      targetType: inline
      script: |
        Write-Host "##vso[task.setvariable variable=ConnectionStrings__CosmosDB]$env:CosmosDbSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubSender]$env:AzureWebJobsEventHubSenderSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubReceiver]$env:AzureWebJobsEventHubReceiverSecretMap"
        Write-Host "##vso[task.setvariable variable=AzureWebJobsEventHubPath]testhub"
    env:
      AzureWebJobsStorageSecretMap: $(Storage)
      AzureWebJobsSecondaryStorageSecretMap: $(SecondaryStorage)
      CosmosDbSecretMap: $(CosmosDb)
      AzureWebJobsEventHubSenderSecretMap: $(EventHub)
      AzureWebJobsEventHubReceiverSecretMap: $(EventHub)

  - task: DotNetCoreCLI@2
    displayName: C# end to end tests
    inputs:
      command: test
      testRunTitle: C# end to end tests
      arguments: '--filter "Group=CSharpEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Node end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Node end to end tests
      arguments: '--filter "Group=NodeEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Direct load end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Direct load end to end tests
      arguments: '--filter "Group=DirectLoadEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: F# end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: F# end to end tests
      arguments: '--filter "Group=FSharpEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Language worker end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Language worker end to end tests
      arguments: '--filter "Group=LanguageWorkerSelectionEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Node script host end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Node script host end to end tests
      arguments: '--filter "Group=NodeScriptHostTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Raw assembly end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Raw assembly end to end tests
      arguments: '--filter "Group=RawAssemblyEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Samples end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Samples end to end tests
      arguments: '--filter "Group=SamplesEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Drain mode end to end tests
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Drain mode end to end tests
      arguments: '--filter "Group=DrainModeEndToEndTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Standby mode end to end tests Windows
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Standby mode end to end tests Windows
      arguments: '--filter "Group=StandbyModeEndToEndTests_Windows" $(test_args)'
      projects: $(test_projects)

  # Disabled to unblock in 202401. Will fix shortly.
  # - task: DotNetCoreCLI@2
  #   displayName: Standby mode end to end tests Linux
  #   condition: succeededOrFailed()
  #   inputs:
  #     command: test
  #     testRunTitle: Standby mode end to end tests Linux
  #     arguments: '--filter "Group=StandbyModeEndToEndTests_Linux" $(test_args)'
  #     projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Linux container end to end tests Windows
    condition: succeededOrFailed()
    inputs:
      command: test
      testRunTitle: Linux container end to end tests Windows
      arguments: '--filter "Group=ContainerInstanceTests" $(test_args)'
      projects: $(test_projects)

  - task: DotNetCoreCLI@2
    displayName: Release verification tests
    condition: ${{ eq(variables.is_release, true) }}
    inputs:
      command: test
      testRunTitle: Release verification tests
      arguments: '--filter "Group=ReleaseTests" $(test_args)'
      projects: $(test_projects)

  - task: AzurePowerShell@5
    condition: and(always(), ne(variables['LeaseBlob'], ''))
    displayName: Checkin secrets
    inputs:
      azureSubscription: Azure-Functions-Host-CI-internal
      azurePowerShellVersion: 'LatestVersion'
      pwsh: true
      ScriptPath: eng/script/checkin-secrets.ps1
      ScriptArguments: '-leaseBlob $(LeaseBlob) -leaseToken $(LeaseToken)'
