parameters:
- name: description
  type: string
- name: functionAppName
  type: string
- name: instanceId
  type: string
- name: os
  type: string
  default: Windows
  values:
    - Windows
    - Linux
- name: appType
  type: string
  default: dotnet
  values:
    - dotnet
    - node
- name: collectPerfViewProfileOnWindows
  type: boolean
  default: false
- name: perfViewCollectArguments
  type: string
  default: ''
- name: collectNetTrace
  type: boolean
  default: false
- name: netTraceCollectArguments
  type: string
- name: createJitTrace
  type: boolean
  default: false

jobs:
- job: ${{ parameters.functionAppName }}_${{ parameters.instanceId }}
  displayName: ${{ parameters.description }} ${{ parameters.instanceId }}
  pool:
    name: 1es-pool-azfunc-benchmarking
    ${{ if eq(parameters.os, 'Linux') }}:
      os: linux
      ${{ if and(eq(parameters.createJitTrace, true), eq(parameters.instanceId, '1')) }}:
        image: 1es-ubuntu-22.04-mms-benchmark-coreclr-builder
      ${{ else }}:
        image: 1es-ubuntu-22.04-benchmark-runner-vanilla
    ${{ else }}:
      os: windows
      ${{ if and(eq(parameters.createJitTrace, true), eq(parameters.instanceId, '1')) }}:
        image: 1es-windows-2022-mms-benchmark-coreclr-builder
      ${{ else }}:
        image: 1es-windows-2022-benchmark-runner-vanilla

  variables:
    WEBSITE_USE_PLACEHOLDER_DOTNETISOLATED: 1
    # Keep this stable across instances so blob-backed host key auth can find the seeded test key.
    WEBSITE_SITE_NAME: PGO_${{ parameters.functionAppName }}_${{ parameters.os }}
    WEBSITE_INSTANCE_ID: ${{ parameters.functionAppName }}_${{ parameters.os }}_${{ parameters.instanceId }} # Simulate App service.
    HOME: $(Build.BinariesDirectory)/home
    functionAppOutputPath: $(HOME)/site/wwwroot
    hostOutputPath: $(Build.BinariesDirectory)/Published/HostRuntime
    logsDirectory: $(Build.ArtifactStagingDirectory)/Logs
    stdOutLogsFilePath: $(logsDirectory)/std_out_logs.txt
    stdErrorLogsFilePath: $(logsDirectory)/std_error_logs.txt
    ${{ if eq(parameters.appType, 'dotnet') }}:
      FUNCTIONS_WORKER_RUNTIME: 'dotnet-isolated'
      FUNCTIONS_WORKER_RUNTIME_VERSION: '9.0'
    ${{ if eq(parameters.appType, 'node') }}:
      FUNCTIONS_WORKER_RUNTIME: 'node'
      WEBSITE_RUN_FROM_PACKAGE: '1' # Node app needs this to use placeholder channel.
    perfViewPath: C:\.tools\perfview\perfview.exe 
    traceDirectory: $(Build.ArtifactStagingDirectory)/out
    netTraceDirectory: $(traceDirectory)/nettrace
    traceFileNameWithoutExtension: PerfViewData_$(Build.BuildNumber)_${{ parameters.functionAppName }}
    traceFileName: $(traceFileNameWithoutExtension).etl
    traceFileZipName: $(traceFileName).zip
    traceFilePath: $(traceDirectory)/$(traceFileName)
    traceZipFilePath: $(traceDirectory)/$(traceFileZipName)
    traceAnalysisResultMarkdownFilePath: $(traceDirectory)/results/$(traceFileNameWithoutExtension).md
    traceLogPath: $(logsDirectory)/logs.log
    ${{ if eq(parameters.os, 'Linux') }}:
      WEBSITE_SKU: FlexConsumption
    ${{ if eq(parameters.os, 'Windows') }}:
      WEBSITE_SKU: Dynamic
    ${{ if and(eq(parameters.collectNetTrace, true), eq(parameters.instanceId, '1')) }}:
      netTraceFileNameWithoutExtension: azfunc_${{ parameters.functionAppName }}_${{ parameters.os }}_${{ parameters.instanceId }}
      netTraceFileName: $(netTraceFileNameWithoutExtension).nettrace
      netTraceFilePath: $(netTraceDirectory)/$(netTraceFileName)
      netTraceAnalysisResultsMarkdownFilePath: $(netTraceDirectory)/results/$(netTraceFileNameWithoutExtension).md
      # For JIT trace generation, ensure the trace is collected from an app with authentication enabled (as done by the SLA site).
    ${{ if and(eq(parameters.createJitTrace, true), eq(parameters.instanceId, '1')) }}:
      warmupApiUrl: http://localhost:5000  # For JIT trace generation case, we call the home page instead of the api/warmup endpoint to ensure the host is up and running.
      ${{ if eq(parameters.os, 'Windows') }}:
        functionInvocationUrl: http://localhost:5000/api/HelloAuth?forcespecialization&code=test
      ${{ if eq(parameters.os, 'Linux') }}:
        functionInvocationUrl: http://localhost:5000/api/HelloAuth?code=test
    ${{ else }}:
      warmupApiUrl: http://localhost:5000/api/warmup?restart=1
      ${{ if eq(parameters.os, 'Windows') }}:
        functionInvocationUrl: http://localhost:5000/api/Hello?forcespecialization
      ${{ if eq(parameters.os, 'Linux') }}:
        functionInvocationUrl: http://localhost:5000/api/Hello

  ${{ if and(or(eq(parameters.collectPerfViewProfileOnWindows, true), eq(parameters.collectNetTrace, true)), eq(parameters.instanceId, '1')) }}:
    templateContext:
      outputParentDirectory: $(traceDirectory)
      outputs:
        - output: pipelineArtifact
          displayName: Publish Trace artifacts
          path: $(traceDirectory)
          artifact: AzFunc_${{ parameters.os }}_${{ parameters.functionAppName }}
          condition: always()

  steps:

  # ── Prerequisites & Build Artifacts ─────────────────────────────────────────

  # Fetch secrets from Key Vault:
  # - PGO-APP-AZURE-WEBJOBS-STORAGE: Storage account connection string for function key management.
  #   Required for admin API authentication (master key validation) and auth-enabled function invocations.
  # - PGO-APP-INSTANCE-ASSIGN-PAYLOAD-ENCRYPTION-KEY: AES encryption key (hex string) used to encrypt
  #   the HostAssignmentContext payload for /admin/instance/assign on Linux. Must match the host's
  #   WEBSITE_AUTH_ENCRYPTION_KEY so it can decrypt the payload (see EncryptionHelper.cs).
  - task: AzureKeyVault@2
    inputs:
      azureSubscription: Azure-Functions-Host-CI-internal
      KeyVaultName: azure-functions-perf
      SecretsFilter: PGO-APP-AZURE-WEBJOBS-STORAGE,PGO-APP-INSTANCE-ASSIGN-PAYLOAD-ENCRYPTION-KEY
      RunAsPreJob: false

  - template: /eng/ci/templates/install-dotnet.yml@self

  - script: dotnet --info
    displayName: "Print .NET Environment Info"

  - pwsh: |
      New-Item -ItemType Directory -Path $(functionAppOutputPath) -Force
    displayName: "Create app home directory"

  - ${{ if eq(parameters.appType, 'node') }}:
    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        version: '24.x'

  - template: /eng/ci/templates/steps/acquire-coldstart-binaries.yml@self
    parameters:
      functionAppName: ${{ parameters.functionAppName }}
      os: ${{ parameters.os }}

  - pwsh: |
      New-Item -ItemType Directory -Path $(logsDirectory) -Force
      New-Item -ItemType Directory -Path $(traceDirectory) -Force
      New-Item -ItemType Directory -Path $(netTraceDirectory) -Force
    displayName: Create directories

  # ── Host Setup ────────────────────────────────────────────────────────────────
  # Windows: IIS/ANCM hosting (production parity). Linux: direct process launch.

  - ${{ if eq(parameters.os, 'Windows') }}:
    - template: /eng/ci/templates/steps/configure-iis-site.yml@self
      parameters:
        createJitTrace: ${{ parameters.createJitTrace }}
        instanceId: ${{ parameters.instanceId }}
  - ${{ else }}:
    - script: |
        nohup $(hostOutputPath)/Microsoft.Azure.WebJobs.Script.WebHost > $(stdOutLogsFilePath) 2> $(stdErrorLogsFilePath) &
        echo $! > $(Build.ArtifactStagingDirectory)/hostProcessId.txt
      displayName: Start host in placeholder mode
      env:
        AzureWebJobsStorage: $(PGO-APP-AZURE-WEBJOBS-STORAGE)
        # WEBSITE_AUTH_ENCRYPTION_KEY is the AES key used by the host to decrypt the EncryptedContext
        # in /admin/instance/assign requests. Must match the key used to encrypt the payload in the pipeline.
        WEBSITE_AUTH_ENCRYPTION_KEY: $(PGO-APP-INSTANCE-ASSIGN-PAYLOAD-ENCRYPTION-KEY)
        # For jittrace generation, disable R2R so framework assemblies are JIT-compiled
        # and captured by dotnet-trace (R2R methods don't fire JittingStarted events).
        ${{ if and(eq(parameters.createJitTrace, true), eq(parameters.instanceId, '1')) }}:
          DOTNET_ReadyToRun: '0'

  # ── Warmup & PID Capture ──────────────────────────────────────────────────────

  - pwsh: |
      $url = "$(warmupApiUrl)"
      Write-Host "Checking if host is ready at $url..."
      $maxAttempts = 15
      $hostReady = $false

      for ($attempt = 0; $attempt -lt $maxAttempts; $attempt++) {
          try {
              $response = Invoke-WebRequest -Uri $url -Method Get -TimeoutSec 30 -UseBasicParsing -ErrorAction Stop
              Write-Host "Host is ready. Status: $($response.StatusCode) $($response.StatusDescription)"
              $hostReady = $true
              break
          } catch {
              if ($attempt -lt ($maxAttempts - 1)) {
                  Write-Host "Attempt $($attempt+1) failed: $($_.Exception.Message). Retrying in 10 seconds..."
                  Start-Sleep -Seconds 10
              } else {
                  Write-Host "Attempt $($attempt+1) failed: $($_.Exception.Message)."
              }
          }
      }

      if (-not $hostReady) {
          Write-Host "##vso[task.logissue type=error]Host was not ready after $maxAttempts attempts."
          exit 1
      }

    displayName: Wait until host is warmed up

  - ${{ if eq(parameters.os, 'Windows') }}:
    - pwsh: |
        # After warmup, w3wp is running. Capture its PID by app pool name for dotnet-trace and cleanup.
        $w3wpPid = & "$env:SystemRoot\System32\inetsrv\appcmd.exe" list wp /apppool.name:FunctionsHostPool /text:WP.NAME
        if ($w3wpPid) {
            Write-Host "w3wp PID for FunctionsHostPool: $w3wpPid"
            echo $w3wpPid > $(Build.ArtifactStagingDirectory)/hostProcessId.txt
            Write-Host "##vso[task.setvariable variable=hostProcessId]$w3wpPid"
        } else {
            Write-Host "##vso[task.logissue type=warning]Could not find w3wp process for FunctionsHostPool"
        }
      displayName: Capture w3wp process ID

  # ── Trace Collection ──────────────────────────────────────────────────────────

  - ${{ if and(eq(parameters.collectPerfViewProfileOnWindows, true), eq(parameters.instanceId, '1')) }}: # collect profile only on the first instance
    - pwsh: |
        if (Test-Path $(perfViewPath)) {
            $collectArguments = ${env:COLLECT_ARGUMENTS}
            Write-Host "PerfView.exe found. Executing with arguments '$collectArguments'"
            $perfViewProcess = Start-Process -FilePath $(perfViewPath) -ArgumentList "collect $collectArguments /LogFile:$(traceLogPath) /DataFile:$(traceFilePath)" -NoNewWindow -PassThru
            Write-Host "PerfView PID: $($perfViewProcess.Id)"
            $perfViewProcess.Id | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/perfViewProcessId.txt" -Encoding ascii
        } else {
            Write-Host "PerfView.exe not found in $(perfViewPath)"
            exit 1
        }
      displayName: Start PerfView
      env:
        COLLECT_ARGUMENTS: ${{ parameters.perfViewCollectArguments }}

  - ${{ if and(eq(parameters.collectNetTrace, true), eq(parameters.instanceId, '1')) }}:
    - pwsh: |
        $os = "${{ parameters.os }}"
        dotnet tool update --global dotnet-trace

        if ($os -eq "Windows") {
            $dotnetToolPath = [System.IO.Path]::Combine($env:USERPROFILE, ".dotnet", "tools")
            $dotnetTraceExecutable = Join-Path $dotnetToolPath "dotnet-trace.exe"
        } else {
            $dotnetToolPath = Join-Path -Path $env:HOME -ChildPath ".dotnet/tools"
            $dotnetTraceExecutable = Join-Path -Path $dotnetToolPath -ChildPath "dotnet-trace"
        }

        $collectArguments = ${env:COLLECT_ARGUMENTS}

        # On Windows/IIS, replace process-name-based attachment (-n) with PID-based (-p)
        # since the host runs inside w3wp.exe, not as Microsoft.Azure.WebJobs.Script.WebHost.
        if ($os -eq "Windows") {
            $hostPid = "$(hostProcessId)"
            if ($hostPid) {
                $collectArguments = $collectArguments -replace '-n\s+\S+', "-p $hostPid"
            }
        }

        $arguments = "collect $collectArguments -o $(netTraceFilePath)"
        Write-Host "dotnet-trace command: $dotnetTraceExecutable $arguments"

        if ($os -eq "Windows") {
            Start-Process -FilePath $dotnetTraceExecutable -ArgumentList $arguments -NoNewWindow
        } else {
            bash -c "nohup $dotnetTraceExecutable $arguments > /dev/null 2>&1 &"
        }
      displayName: "Start dotnet trace"
      env:
        COLLECT_ARGUMENTS: ${{ parameters.netTraceCollectArguments }}

  # ── Cold Start ────────────────────────────────────────────────────────────────
  # See eng/ci/templates/steps/invoke-coldstart.yml for the specialization logic per OS.

  - template: /eng/ci/templates/steps/invoke-coldstart.yml@self
    parameters:
      os: ${{ parameters.os }}

  # ── Post-Collection & Cleanup ───────────────────────────────────────────────

  - ${{ if and(eq(parameters.collectPerfViewProfileOnWindows, true), eq(parameters.instanceId, '1')) }}:
    - pwsh: |
        Write-Host "Stopping PerfView..."
        & $(perfViewPath) stop

        # Wait for the zip file to be created
        $maxAttempts = 20
        $attempt = 0

        while ($attempt -lt $maxAttempts) {
            $files = Get-ChildItem -Path $(traceDirectory) -File
            $fileCount = $files.Count

            Write-Host "Found $fileCount file(s) in $(traceDirectory):"
            foreach ($file in $files) {
                Write-Host "  - $($file.Name)"
            }
            
            if ($fileCount -eq 1 -and $files[0].Name -eq '$(traceFileZipName)') {
                break
            } else {
                Write-Host "Expected zip file not found. Rechecking again in 15 seconds..."
                Start-Sleep -Seconds 15
                $attempt++
            }
        }

        $perfViewPidFile = "$(Build.ArtifactStagingDirectory)/perfViewProcessId.txt"
        if (Test-Path $perfViewPidFile) {
            $perfViewPid = Get-Content $perfViewPidFile
            $perfViewProcess = Get-Process -Id $perfViewPid -ErrorAction SilentlyContinue
            if ($perfViewProcess) {
                Write-Host "Stopping PerfView process with PID: $perfViewPid"
                Stop-Process -Id $perfViewPid -Force
            }
        }

        Write-Host "PerfView logs:"
        Get-Content $(traceLogPath)
      displayName: Stop PerfView

    - pwsh: |
        # Install the profile analyzer tool and run it on the trace file.
        dotnet tool update -g Microsoft.Azure.Functions.ColdStartProfileAnalyzer --prerelease
        func-cold-start-analyzer --file $(traceZipFilePath) --format markdown text

        # Upload analysis result
        Write-Host "##vso[task.addattachment type=Distributedtask.Core.Summary;name=$env:OS $env:FUNCTION_APP_NAME;]$(traceAnalysisResultMarkdownFilePath)"
      displayName: Analyze profile
      env:
        FUNCTION_APP_NAME: ${{ parameters.functionAppName }}
        OS: ${{ parameters.os }}

  - pwsh: |
      $os = "${{ parameters.os }}"
      $shouldWaitForNetTrace = "${{ parameters.collectNetTrace }}" -ieq "true" -and "${{ parameters.instanceId }}" -eq "1"
      if ($shouldWaitForNetTrace) {
          Start-Sleep -Seconds 75 # Must exceed dotnet-trace --duration (60s) to ensure trace is complete.
      }

      if ($os -eq "Windows") {
          # Stop IIS site and app pool
          $appcmd = "$env:SystemRoot\System32\inetsrv\appcmd.exe"
          & $appcmd stop site "FunctionsHost" 2>$null
          & $appcmd stop apppool "FunctionsHostPool" 2>$null
      }

      # Stop the host process (w3wp on Windows, direct process on Linux)
      $processIdFile = "$(Build.ArtifactStagingDirectory)/hostProcessId.txt"
      if (Test-Path $processIdFile) {
          $processId = (Get-Content $processIdFile).Trim()
          $proc = Get-Process -Id $processId -ErrorAction SilentlyContinue
          if ($proc) {
              if ($os -eq "Windows") {
                  Write-Host "Stopping w3wp process with PID: $processId"
                  Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
              } else {
                  Write-Host "Sending SIGTERM to functions host process PID: $processId"
                  & kill -s TERM $processId 2>/dev/null
              }
          } else {
              Write-Host "Host process (PID: $processId) is not running."
          }
      } else {
          Write-Host "Process ID file not found."
      }
    displayName: Stop host process
    condition: always()

  - pwsh: |
      $isWindowsOS = "${{ parameters.os }}" -eq "Windows"

      if ($isWindowsOS) {
          # On Windows/IIS, logs are written by ANCM to stdout log files
          Write-Host "ANCM stdout logs:"
          $stdoutLogs = Get-ChildItem "$(logsDirectory)/stdout*" -ErrorAction SilentlyContinue
          if ($stdoutLogs) {
              foreach ($log in $stdoutLogs) {
                  Write-Host "--- $($log.Name) ---"
                  Get-Content $log.FullName
              }
          } else {
              Write-Host "No ANCM stdout log files found."
          }
      } else {
          Write-Host "Logs:"
          Get-Content $(stdOutLogsFilePath)
          Write-Host "----"
          Write-Host "Error logs:"
          Get-Content $(stdErrorLogsFilePath)
      }
    displayName: Print logs
    condition: always()

  # ── Trace Analysis ────────────────────────────────────────────────────────────

  - ${{ if and(eq(parameters.collectNetTrace, true), eq(parameters.instanceId, '1')) }}:
    - pwsh: |
        Write-Host "Checking '$(netTraceFileName)' file is generated inside '$(netTraceDirectory)'"
        $maxAttempts = 10
        $attempt = 0
        $traceFound = $false
        $expectedTracePath = Join-Path "$(netTraceDirectory)" "$(netTraceFileName)"

        while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 15
            $files = Get-ChildItem -Path $(netTraceDirectory)
            $fileCount = $files.Count
            Write-Host "Found $fileCount files in $(netTraceDirectory)"
            if (Test-Path $expectedTracePath) {
                Write-Host "Found expected .nettrace file: $(netTraceFileName)"
                $traceFound = $true
                break
            } else {
                Write-Host "Expected .nettrace file not found. Rechecking again in 15 seconds..."
                $attempt++
            }
        }  

        if (-not $traceFound) {
            Write-Host "##vso[task.logissue type=error]Expected .nettrace file was not created after $maxAttempts attempts."
            exit 1
        }
      displayName: Wait until trace file is created

    - pwsh: |
        dotnet tool update -g Microsoft.Azure.Functions.ColdStartProfileAnalyzer --prerelease
        $cmd = "func-cold-start-analyzer --file $(netTraceFilePath) --format markdown text"
        $extraArgs = ${env:ANALYZER_ARGS}
        if ($extraArgs) {
            # Split the env var into individual arguments to avoid passing as a single string
            $argList = $extraArgs -split '\s+'
            Write-Host "Invoking: $cmd $extraArgs"
            & func-cold-start-analyzer --file $(netTraceFilePath) --format markdown text @argList
        } else {
            Write-Host "Invoking: $cmd"
            func-cold-start-analyzer --file $(netTraceFilePath) --format markdown text
        }
      displayName: Generate JIT trace
      ${{ if and(eq(parameters.createJitTrace, true), eq(parameters.instanceId, '1')) }}:
        env:
          ANALYZER_ARGS: --generate-jittrace --jittrace-exclude-before-buffer 3000 --jittrace-exclude-after-buffer 3000

    - pwsh: |
        Get-ChildItem -Path "$(netTraceDirectory)"
      displayName: List contents of netTraceDirectory

    - pwsh: |
        if (Test-Path $(netTraceAnalysisResultsMarkdownFilePath)) {
            Write-Host "Analysis result file is present at $(netTraceAnalysisResultsMarkdownFilePath)"
            Write-Host "##vso[task.addattachment type=Distributedtask.Core.Summary;name=$env:OS $env:FUNCTION_APP_NAME;]$(netTraceAnalysisResultsMarkdownFilePath)"
        } else {
            Write-Host "Analysis result file is not present at $(netTraceAnalysisResultsMarkdownFilePath)"
        }
      displayName: Upload analysis result
      env:
        FUNCTION_APP_NAME: ${{ parameters.functionAppName }}
        OS: ${{ parameters.os }}
