  #           cd $(runtimeSourceDirectory)
  #           ./build.cmd -subset clr -configuration Debug
  #       displayName: Build CoreCLR on Windows

  #   - ${{ if eq(parameters.os, 'Linux') }}:
  #     - pwsh: |
  #           cd $(runtimeSourceDirectory)
  #           ./build.sh -subset clr -configuration Debug
  #       displayName: Build CoreCLR on Linux

  #   - pwsh: |
  #       Write-Host "Listing contents of $(dotnetPgoOutputDir):"
  #       if (Test-Path "$(dotnetPgoOutputDir)") {
  #         Get-ChildItem -Path "$(dotnetPgoOutputDir)"
  #       }
  #       else {
  #         Write-Host "Directory $(dotnetPgoOutputDir) not found."
  #       }
  #     displayName: "List Contents of pgo output dir"

  #   - pwsh: |
  #       & $(dotnetPgoExecutablePath) create-jittrace -t $(netTraceFilePath) -o $(jitTraceFilePath)
  #     displayName: Execute  

  - pwsh: |
      Get-ChildItem -Path "$(jitTraceDirectory)"
